<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dirt Bike Trails & Tracks</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 320px;
      background: #f5f5f5;
      padding: 15px;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }

    #map { flex: 1; }

    h2 { margin-top: 0; }

    select, button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
    }

    .item {
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .item:hover { background: #e8e8e8; }

    .tag {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
      margin-right: 4px;
      display: inline-block;
    }

    .trail { background: #444; }
    .mx { background: #d9534f; }

    .veh-group label {
      display: block;
      margin-top: 5px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>🏍️ Dirt Bike Finder</h2>

  <!-- Difficulty filter -->
  <label>Difficulty</label>
  <select id="difficulty">
    <option value="all">All</option>
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
  </select>

  <!-- Type filter -->
  <label style="margin-top:10px;">Type</label>
  <select id="type">
    <option value="all">All</option>
    <option value="trail">Trails</option>
    <option value="mx">Tracks</option>
  </select>

  <!-- VEHICLE FILTER (NEW) -->
  <label style="margin-top:10px;">Vehicle Type</label>
  <div class="veh-group">
    <label><input type="checkbox" class="veh" value="bikes" checked> Bikes</label>
    <label><input type="checkbox" class="veh" value="utv" checked> UTVs</label>
    <label><input type="checkbox" class="veh" value="atv" checked> ATVs</label>
  </div>

  <button onclick="loadData()">Load Nearby</button>

  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let markers = [];

// 🧠 Database (NOW includes vehicles)
const data = [
  { name: "Club Moto MX", type: "mx", difficulty: "advanced", vehicles: ["bikes"], coords: [37.7016, -121.7650] },
  { name: "Argyll MX Park", type: "mx", difficulty: "intermediate", vehicles: ["bikes", "utv", "atv"], coords: [38.4440, -121.8200] },
  { name: "Corral Hollow OHV", type: "trail", difficulty: "intermediate", vehicles: ["bikes", "utv", "atv"], coords: [37.6200, -121.5600] },
  { name: "Del Puerto Canyon", type: "trail", difficulty: "advanced", vehicles: ["bikes"], coords: [37.4550, -121.1100] },
  { name: "Beginner Practice Area", type: "trail", difficulty: "beginner", vehicles: ["bikes", "atv"], coords: [37.6500, -121.7000] }
];

function getColor(diff) {
  if (diff === "beginner") return "green";
  if (diff === "intermediate") return "orange";
  return "red";
}

function initMap(lat, lng) {
  map = L.map('map').setView([lat, lng], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  L.marker([lat, lng]).addTo(map)
    .bindPopup("📍 You are here")
    .openPopup();
}

function clear() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

// get selected vehicles
function getSelectedVehicles() {
  return Array.from(document.querySelectorAll(".veh:checked"))
    .map(cb => cb.value);
}

function loadData() {
  const diff = document.getElementById("difficulty").value;
  const type = document.getElementById("type").value;
  const vehicles = getSelectedVehicles();

  const list = document.getElementById("list");
  list.innerHTML = "";
  clear();

  data.forEach(item => {
    if (diff !== "all" && item.difficulty !== diff) return;
    if (type !== "all" && item.type !== type) return;

    // must match at least one selected vehicle
    if (!item.vehicles.some(v => vehicles.includes(v))) return;

    const marker = L.circleMarker(item.coords, {
      radius: 8,
      color: getColor(item.difficulty),
      fillOpacity: 0.9
    }).addTo(map);

    marker.bindPopup(`
      <b>${item.name}</b><br>
      Type: ${item.type}<br>
      Difficulty: ${item.difficulty}<br>
      Vehicles: ${item.vehicles.join(", ")}
    `);

    markers.push(marker);

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.name}</b><br>
      <span class="tag ${item.type}">${item.type}</span>
      <span class="tag" style="background:${getColor(item.difficulty)};">
        ${item.difficulty}
      </span>
    `;

    div.onclick = () => {
      map.setView(item.coords, 13);
      marker.openPopup();
    };

    list.appendChild(div);
  });
}

initMap(37.7749, -122.4194);
</script>

</body>
</html>
