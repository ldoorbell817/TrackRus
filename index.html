<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dirt Bike Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 360px;
  background: #f4f4f4;
  padding: 12px;
  overflow-y: auto;
}

#map {
  flex: 1;
}

.item {
  background: white;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.item:hover {
  background: #eaeaea;
}

select, button {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>🏍️ Finder</h2>

<button onclick="applyFilters()">Show Spots</button>

<hr>

<h3>Filters</h3>

<select id="filterType">
  <option value="all">All Types</option>
  <option value="trail">Trails</option>
  <option value="mx">Tracks</option>
</select>

<select id="filterDiff">
  <option value="all">All Difficulty</option>
  <option value="beginner">Beginner</option>
  <option value="intermediate">Intermediate</option>
  <option value="advanced">Advanced</option>
</select>

<label>Vehicle Type</label>
<select id="filterVehicle" multiple>
  <option value="bike">Bikes</option>
  <option value="utv">UTV</option>
  <option value="atv">ATV</option>
</select>

<hr>

<div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let markers = [];

// PRELOADED DATA
const spots = [
  { name: "Club Moto MX", type: "mx", difficulty: "advanced", vehicle: ["bike"], lat: 37.7016, lng: -121.7650 },
  { name: "Argyll MX Park", type: "mx", difficulty: "intermediate", vehicle: ["bike"], lat: 38.4440, lng: -121.8200 },
  { name: "Corral Hollow OHV", type: "trail", difficulty: "intermediate", vehicle: ["bike","atv","utv"], lat: 37.6200, lng: -121.5600 },
  { name: "Del Puerto Canyon", type: "trail", difficulty: "advanced", vehicle: ["bike","atv"], lat: 37.4550, lng: -121.1100 },
  { name: "Beginner Practice Area", type: "trail", difficulty: "beginner", vehicle: ["bike"], lat: 37.6500, lng: -121.7000 }
];

// INIT MAP
function initMap() {
  map = L.map('map').setView([37.7749, -122.4194], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
}

// FILTER + RENDER
function applyFilters() {
  const type = document.getElementById("filterType").value;
  const diff = document.getElementById("filterDiff").value;

  const selectedVehicles = Array.from(
    document.getElementById("filterVehicle").selectedOptions
  ).map(o => o.value);

  const filtered = spots.filter(s => {

    if (type !== "all" && s.type !== type) return false;
    if (diff !== "all" && s.difficulty !== diff) return false;

    if (selectedVehicles.length > 0) {
      if (!s.vehicle.some(v => selectedVehicles.includes(v))) return false;
    }

    return true;
  });

  render(filtered);
}

// RENDER
function render(data) {
  document.getElementById("list").innerHTML = "";
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  data.forEach(s => {
    const marker = L.marker([s.lat, s.lng]).addTo(map);
    markers.push(marker);

    marker.bindPopup(`<b>${s.name}</b><br>${s.type} | ${s.difficulty}`);

    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<b>${s.name}</b><br>${s.type} | ${s.difficulty}`;

    div.onclick = () => {
      map.setView([s.lat, s.lng], 13);
      marker.openPopup();
    };

    document.getElementById("list").appendChild(div);
  });
}

// START
initMap();
applyFilters();
</script>

</body>
</html>
